<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Работа рядом</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="header">
      <div class="logo">💼 Работа рядом</div>
      <nav>
        <a href="#">Вакансии</a>
        <a href="#">Компании</a>
        <a href="#">Резюме</a>
        <a href="#">О нас</a>
      </nav>

      <div class="auth">
        <button class="login">Войти</button>
        <button class="register">Регистрация</button>
      </div>
    </header>

    <section class="hero">
      <div class="hero-content">
        <h1>
          Найти работу,<br />
          о котором мечтаешь
        </h1>
        <p>Удобный поиск вакансий в твоём городе</p>
        <div class="search-box">
          <input type="text" placeholder="Должность или ключевое слово" />
          <select>
            <option>Бишкек</option>
            <option>Ош</option>
            <option>Другой город</option>
          </select>
          <select>
            <option>Все категории</option>
            <option>Продажи</option>
            <option>IT</option>
            <option>Образование</option>
            <option>Медицина</option>
          </select>

          <button>Найти</button>
          <center><img src="./image.png" alt="" width="1300" /></center>
        </div>
      </div>
    </section>

    <section class="categories">
      <h2>Популярные направление</h2>
      <div class="category-list">
        <div class="category">
          💻
          <span>IT</span>
        </div>
        <div class="category">
          📞
          <span> Продажи</span>
        </div>
        <div class="category">
          👩‍🏫
          <span> Образование</span>
        </div>
        <div class="category">
          🚗
          <span>Водители</span>
        </div>
        <div class="category">
          🏥
          <span>Медицина</span>
        </div>
      </div>
    </section>
    <section class="jobs">
      <h2>Свежие вакансии</h2>
      <div class="jobs-list">
        <div class="jobs-card">
          <div class="jobs-icon">💼</div>
          <div class="info">
            <h3>Менеджер по продажам</h3>
            <p>ТехноСервис</p>
            <span> 📍 Бишкек ● Полный день</span>
            <strong> 40 000 - 80 000 сом</strong>
            <div>
              <button class="apply">Откликнуться</button>
            </div>
          </div>
        </div>
      </div>
    </section>
    <script src="script.js"></script>
  </body>
</html>
